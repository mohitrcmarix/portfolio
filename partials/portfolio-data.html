ener with signature verification in PHP OOP.","Enhanced customer checkout UX resulting in lower cart abandonment rates."],"stack":["WooCommerce","Core PHP","PHP OOP","Razorpay Gateway","AJAX","REST APIs","MySQL"],"badge":"Payment Integration"},{"id":"custom-acf-plugins","title":"Custom Theme \u0026 ACF Dynamic Content Engine","category":"wordpress","category_label":"Custom WordPress Themes","url":"#","url_display":"Enterprise Theme Boilerplate","summary":"Modular custom WordPress theme built from scratch with Advanced Custom Fields (ACF Pro) flexible layout blocks and native PHP templates.","description":"Developed custom WordPress themes from blank canvases eliminating heavyweight theme builders where performance was paramount. Utilized ACF Flexible Content and Gutenberg custom blocks to give content editors full visual control while retaining 100\/100 code efficiency.","achievements":["Replaced bloated visual builders with ultra-clean, semantic ACF flexible modules.","Implemented custom post types (CPTs), custom taxonomies, and AJAX filter queries.","Engineered fully accessible (WCAG compliant) semantic HTML5 markup.","Ensured seamless styling with pure modern CSS custom properties and micro-interactions."],"stack":["Custom Themes","ACF Pro","Core PHP","PHP OOP","HTML5","CSS3","jQuery"],"badge":"Custom Architecture"}],"code_snippets":[{"id":"php-ajax","title":"Custom WordPress AJAX Handler \u0026 Nonce Check","language":"php","code":"\u003C?php\n\/**\n * Secure WordPress AJAX Endpoint for Dynamic Filtering\n * Developed by Mohit Rathod\n *\/\nadd_action(\u0027wp_ajax_filter_portfolio_projects\u0027, \u0027mohit_filter_portfolio_projects\u0027);\nadd_action(\u0027wp_ajax_nopriv_filter_portfolio_projects\u0027, \u0027mohit_filter_portfolio_projects\u0027);\n\nfunction mohit_filter_portfolio_projects() {\n    \/\/ Verify Security Nonce\n    check_ajax_referer(\u0027mohit_portfolio_nonce\u0027, \u0027security\u0027);\n\n    $category = isset($_POST[\u0027category\u0027]) ? sanitize_text_field($_POST[\u0027category\u0027]) : \u0027all\u0027;\n    \n    $args = [\n        \u0027post_type\u0027      =\u003E \u0027portfolio_project\u0027,\n        \u0027posts_per_page\u0027 =\u003E 9,\n        \u0027post_status\u0027    =\u003E \u0027publish\u0027,\n    ];\n\n    if ($category !== \u0027all\u0027) {\n        $args[\u0027tax_query\u0027] = [\n            [\n                \u0027taxonomy\u0027 =\u003E \u0027project_category\u0027,\n                \u0027field\u0027    =\u003E \u0027slug\u0027,\n                \u0027terms\u0027    =\u003E $category,\n            ]\n        ];\n    }\n\n    $query = new WP_Query($args);\n    $projects = [];\n\n    if ($query-\u003Ehave_posts()) {\n        while ($query-\u003Ehave_posts()) {\n            $query-\u003Ethe_post();\n            $projects[] = [\n                \u0027id\u0027       =\u003E get_the_ID(),\n                \u0027title\u0027    =\u003E get_the_title(),\n                \u0027excerpt\u0027  =\u003E get_the_excerpt(),\n                \u0027live_url\u0027 =\u003E get_field(\u0027live_website_url\u0027),\n                \u0027stack\u0027    =\u003E get_field(\u0027tech_stack_tags\u0027),\n                \u0027thumb\u0027    =\u003E get_the_post_thumbnail_url(get_the_ID(), \u0027medium_large\u0027),\n            ];\n        }\n        wp_reset_postdata();\n        wp_send_json_success([\u0027projects\u0027 =\u003E $projects]);\n    } else {\n        wp_send_json_error([\u0027message\u0027 =\u003E \u0027No projects found in this category.\u0027]);\n    }\n}"},{"id":"razorpay-woo","title":"WooCommerce Custom Fee \u0026 Razorpay Hook","language":"php","code":"\u003C?php\n\/**\n * WooCommerce Custom Dynamic Checkout Logic\n * Developed by Mohit Rathod\n *\/\nadd_action(\u0027woocommerce_cart_calculate_fees\u0027, \u0027mohit_custom_express_handling_fee\u0027);\nfunction mohit_custom_express_handling_fee($cart) {\n    if (is_admin() \u0026\u0026 !defined(\u0027DOING_AJAX\u0027)) {\n        return;\n    }\n\n    \/\/ Check custom customer session flag\n    $is_express = WC()-\u003Esession-\u003Eget(\u0027mohit_express_delivery\u0027);\n    if ($is_express) {\n        $fee_amount = 150.00; \/\/ INR express packaging\n        $cart-\u003Eadd_fee(__(\u0027Express Priority Handling\u0027, \u0027mohit-theme\u0027), $fee_amount, true, \u0027standard\u0027);\n    }\n}\n\n\/\/ Razorpay Custom Payment Verification Hook\nadd_action(\u0027woocommerce_payment_complete\u0027, \u0027mohit_verify_razorpay_order_status\u0027);\nfunction mohit_verify_razorpay_order_status($order_id) {\n    $order = wc_get_order($order_id);\n    if (!$order) return;\n\n    if ($order-\u003Eget_payment_method() === \u0027razorpay\u0027) {\n        $razorpay_payment_id = $order-\u003Eget_meta(\u0027_razorpay_payment_id\u0027);\n        if (!empty($razorpay_payment_id)) {\n            $order-\u003Eadd_order_note(\n                sprintf(__(\u0027Payment verified via Razorpay ID: %s. Order moved to processing.\u0027, \u0027mohit-theme\u0027), $razorpay_payment_id)\n            );\n        }\n    }\n}"},{"id":"core-php-crud","title":"Core PHP OOP Database Manager (PDO \u0026 Prepared Statements)","language":"php","code":"\u003C?php\n\/**\n * Core PHP OOP Database CRUD Class\n * Developed by Mohit Rathod\n *\/\nclass DatabaseManager {\n    private PDO $pdo;\n\n    public function __construct(string $host, string $db, string $user, string $pass) {\n        $dsn = \u0022mysql:host={$host};dbname={$db};charset=utf8mb4\u0022;\n        $options = [\n            PDO::ATTR_ERRMODE            =\u003E PDO::ERRMODE_EXCEPTION,\n            PDO::ATTR_DEFAULT_FETCH_MODE =\u003E PDO::FETCH_ASSOC,\n            PDO::ATTR_EMULATE_PREPARES   =\u003E false,\n        ];\n        $this-\u003Epdo = new PDO($dsn, $user, $pass, $options);\n    }\n\n    public function insert(string $table, array $data): int {\n        $fields = implode(\u0027, \u0027, array_keys($data));\n        $placeholders = \u0027:\u0027 . implode(\u0027, :\u0027, array_keys($data));\n        $sql = \u0022INSERT INTO {$table} ({$fields}) VALUES ({$placeholders})\u0022;\n        \n        $stmt = $this-\u003Epdo-\u003Eprepare($sql);\n        $stmt-\u003Eexecute($data);\n        return (int)$this-\u003Epdo-\u003ElastInsertId();\n    }\n\n    public function fetchAllWhere(string $table, string $column, $value): array {\n        $sql = \u0022SELECT * FROM {$table} WHERE {$column} = :val ORDER BY id DESC\u0022;\n        $stmt = $this-\u003Epdo-\u003Eprepare($sql);\n        $stmt-\u003Eexecute([\u0027val\u0027 =\u003E $value]);\n        return $stmt-\u003EfetchAll();\n    }\n}"}]}</script>
